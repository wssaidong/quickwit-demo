name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-compose:
    name: Docker Compose Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Quickwit
        run: |
          mkdir -p qwdata
          QW_VERSION=v0.8.2 docker compose up -d quickwit

      - name: Wait for Quickwit
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:7280/api/v1/version && break
            sleep 1
          done

      - name: Check version
        run: docker compose exec -T quickwit quickwit --version

      - name: Download index config
        run: |
          curl -sO https://raw.githubusercontent.com/quickwit-oss/quickwit/main/config/tutorials/stackoverflow/index-config.yaml

      - name: Download dataset
        run: curl -sO https://quickwit-datasets-public.s3.amazonaws.com/stackoverflow.posts.transformed-10000.json

      - name: Create index
        run: |
          curl -s -XPOST http://localhost:7280/api/v1/indexes \
            -H 'Content-Type: application/yaml' \
            --data-binary @stackoverflow-index-config.yaml

      - name: Ingest data
        run: |
          curl -s -XPOST "http://localhost:7280/api/v1/stackoverflow/ingest?commit=force" \
            --data-binary @stackoverflow.posts.transformed-10000.json

      - name: Run search test
        run: |
          RESULT=$(curl -s "http://localhost:7280/api/v1/stackoverflow/search?query=search+AND+engine")
          echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('num_hits',0) > 0; print(f'Found {d[\"num_hits\"]} hits')"

      - name: Run aggregation test
        run: |
          curl -s -XPOST "http://localhost:7280/api/v1/stackoverflow/search" \
            -H "Content-Type: application/json" \
            -d '{"query":"*","max_hits":0,"aggs":{"top_tags":{"terms":{"field":"tags","size":5}}}}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); buckets=d.get('aggregations',{}).get('top_tags',{}).get('buckets',[]); assert len(buckets) > 0; print(f'Aggregation: {len(buckets)} buckets')"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  makefile:
    name: Makefile Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Quickwit
        run: |
          mkdir -p qwdata
          QW_VERSION=v0.8.2 docker compose up -d quickwit

      - name: Wait for Quickwit
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:7280/api/v1/version && break
            sleep 1
          done

      - name: Download assets
        run: |
          curl -sO https://raw.githubusercontent.com/quickwit-oss/quickwit/main/config/tutorials/stackoverflow/index-config.yaml
          curl -sO https://quickwit-datasets-public.s3.amazonaws.com/stackoverflow.posts.transformed-10000.json

      - name: Run Makefile targets
        env:
          QW_VERSION: v0.8.2
        run: |
          make index QW_VERSION=v0.8.2
          make ingest QW_VERSION=v0.8.2
          make search QW_VERSION=v0.8.2
          make help

      - name: Cleanup
        if: always()
        run: docker compose down -v
